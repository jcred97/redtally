name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Locate native PostgreSQL binaries
        run: |
          postgres_bin="$(pg_config --bindir)"
          test -x "$postgres_bin/initdb"
          test -x "$postgres_bin/pg_ctl"
          echo "REDTALLY_POSTGRES_BIN=$postgres_bin" >> "$GITHUB_ENV"
      - run: npm run test:native
